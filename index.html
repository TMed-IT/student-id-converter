<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>学籍番号 → 名前 変換ツール</title>
<!-- fixed: XSS対策・Shift-JIS対応・スケール統一・デッドコード削除・大容量警告 -->
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #f0ede8;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --text: #1a1917;
    --text2: #6b6860;
    --text3: #9b9890;
    --accent: #2563a8;
    --accent-light: #e8f0fa;
    --accent-dark: #1a4a82;
    --success: #1a6e3c;
    --success-light: #e6f4ec;
    --danger: #991f1f;
    --danger-light: #fce8e8;
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Hiragino Sans', 'ヒラギノ角ゴ ProN', 'Yu Gothic', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px 16px 40px; max-width: 680px; margin: 0 auto; }
  header { margin-bottom: 28px; padding-top: 8px; }
  header h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  header p { font-size: 13px; color: var(--text2); margin-top: 4px; }
  .privacy-note { display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; font-size: 12px; color: var(--success); background: var(--success-light); padding: 5px 10px; border-radius: 999px; font-weight: 500; }
  .step { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; }
  .step-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .step-num { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: white; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .step-num-icon { width: 24px; height: 24px; border-radius: 50%; background: var(--surface2); color: var(--text2); font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .step-title { font-size: 15px; font-weight: 500; }
  .upload-area { border: 1.5px dashed var(--border2); border-radius: var(--radius-sm); padding: 22px 16px; text-align: center; cursor: pointer; transition: background 0.15s; user-select: none; }
  .upload-area:hover, .upload-area:active { background: var(--surface2); }
  .upload-area .ico { font-size: 26px; display: block; margin-bottom: 6px; }
  .upload-area .label { font-size: 14px; color: var(--text2); }
  .upload-area .hint { font-size: 12px; color: var(--text3); margin-top: 3px; }
  input[type=file] { display: none; }
  .chip { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 9px 12px; background: var(--surface2); border-radius: var(--radius-sm); }
  .chip-name { font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 500; white-space: nowrap; }
  .badge-blue { background: var(--accent-light); color: var(--accent-dark); }
  .badge-green { background: var(--success-light); color: var(--success); }
  .badge-red { background: var(--danger-light); color: var(--danger); }
  .run-btn { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: var(--radius); font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.15s, transform 0.1s; margin-top: 4px; font-family: inherit; }
  .run-btn:not(:disabled):hover { background: var(--accent-dark); }
  .run-btn:not(:disabled):active { transform: scale(0.98); }
  .run-btn:disabled { background: var(--surface2); color: var(--text3); cursor: not-allowed; }
  #progress-section { display: none; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 18px; margin-top: 14px; }
  .progress-label { font-size: 13px; color: var(--text2); margin-bottom: 10px; }
  .progress-bar-wrap { height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; width: 0%; }
  .progress-stage { font-size: 12px; color: var(--text3); margin-top: 6px; }
  #viewer-section { display: none; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 18px; margin-top: 14px; }
  .viewer-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .tb-btn { padding: 7px 12px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: none; font-size: 13px; cursor: pointer; color: var(--text); font-family: inherit; transition: background 0.12s; }
  .tb-btn:hover { background: var(--surface2); }
  .tb-btn.active { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
  .tb-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #page-info { font-size: 13px; color: var(--text2); flex: 1; text-align: center; }
  .canvas-wrap { position: relative; width: 100%; overflow: auto; background: #d1d5db; border-radius: var(--radius-sm); max-height: 75vh; -webkit-overflow-scrolling: touch; }
  #pdf-canvas { display: block; width: 100%; height: auto; }
  #overlay-canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
  /* #pdf-canvas と #overlay-canvas のスタイルは .canvas-wrap 内で定義 */
  #img-wrap { position: relative; display: none; }
  #source-img { display: block; max-width: 100%; }
  #img-overlay { position: absolute; top: 0; left: 0; pointer-events: none; }
  .stats-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .section-divider { font-size: 11px; font-weight: 500; color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 10px; }
  .result-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 0.5px solid var(--border); font-size: 14px; }
  .result-item:last-child { border-bottom: none; }
  .result-id { font-family: 'Courier New', monospace; color: var(--text2); font-size: 13px; min-width: 60px; }
  .result-arrow { color: var(--text3); }
  .result-name { font-weight: 500; }
  .result-name.unmatched { color: var(--danger); font-weight: 400; }
</style>
</head>
<body>

<header>
  <h1>学籍番号 → 名前 変換</h1>
  <p>PDFのテキストから学籍番号を検出して名前に置き換えます</p>
  <span class="privacy-note">🔒 すべてブラウザ内で処理 — 個人情報は外部に送信されません</span>
</header>

<div class="step">
  <div class="step-header">
    <div class="step-num">1</div>
    <span class="step-title">対応表（CSVファイル）</span>
  </div>
  <div class="upload-area" onclick="document.getElementById('csv-input').click()">
    <span class="ico">📋</span>
    <p class="label">CSVをタップして選択</p>
    <p class="hint">フォーマット：学籍番号,名前（例: 21001,田中 太郎）— 桁数は⚙で変更可</p>
  </div>
  <input type="file" id="csv-input" accept=".csv,text/csv" onchange="loadCSV(this)">
  <div id="csv-chip" class="chip" style="display:none;">
    <span class="chip-name" id="csv-name"></span>
    <span class="badge badge-green" id="csv-count"></span>
  </div>
</div>

<div class="step" style="padding:0;">
  <button onclick="toggleDigitsSetting()" id="digits-toggle-btn"
    style="width:100%; display:flex; align-items:center; gap:10px; padding:14px 18px;
           background:none; border:none; cursor:pointer; font-family:inherit; text-align:left;">
    <span style="font-size:13px;">⚙</span>
    <span style="font-size:14px; color:var(--text2); flex:1;">詳細設定（学籍番号の桁数）</span>
    <span id="digits-summary" style="font-size:12px; color:var(--text3);">5桁</span>
    <span id="digits-chevron" style="font-size:11px; color:var(--text3); transition:transform 0.2s;">▼</span>
  </button>
  <div id="digits-body" style="display:none; padding:0 18px 16px; border-top:0.5px solid var(--border);">
    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:14px;">
      <label style="font-size:14px; color:var(--text2);">桁数（数字部分）</label>
      <div style="display:flex; align-items:center; gap:6px;">
        <button class="tb-btn" onclick="changeDigits(-1)" id="digits-minus">－</button>
        <span id="digits-display" style="font-size:16px; font-weight:600; min-width:28px; text-align:center;">5</span>
        <button class="tb-btn" onclick="changeDigits(+1)" id="digits-plus">＋</button>
      </div>
      <span class="badge badge-blue" id="digits-badge">5桁モード（例: 11111）</span>
    </div>
    <p style="font-size:12px; color:var(--text3); margin-top:8px;">CSVのフォーマット: 学籍番号,名前 — 数字部分が指定桁数のものを検出します</p>
  </div>
</div>

<div class="step">
  <div class="step-header">
    <div class="step-num">2</div>
    <span class="step-title">変換するファイル</span>
  </div>
  <div class="upload-area" onclick="document.getElementById('file-input').click()">
    <span class="ico">📄</span>
    <p class="label">PDFをタップして選択</p>
    <p class="hint">PDF のみ対応（テキストレイヤー付き）</p>
  </div>
  <input type="file" id="file-input" accept="application/pdf" onchange="onFileSelect(this)">
  <div id="file-chip" class="chip" style="display:none;">
    <span class="chip-name" id="file-name"></span>
    <span class="badge badge-blue" id="file-type-badge"></span>
  </div>
</div>

<button class="run-btn" id="run-btn" disabled onclick="runConversion()">変換してオーバーレイ表示</button>

<div id="progress-section">
  <p class="progress-label" id="progress-label">処理中...</p>
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-bar"></div></div>
  <p class="progress-stage" id="progress-stage"></p>
</div>

<div id="viewer-section">
  <p class="section-divider">変換結果</p>
  <div class="viewer-toolbar">
    <button class="tb-btn" id="prev-btn" onclick="prevPage()" disabled>‹ 前</button>
    <span id="page-info"></span>
    <button class="tb-btn" id="next-btn" onclick="nextPage()" disabled>次 ›</button>
    <button class="tb-btn active" id="toggle-btn" onclick="toggleOverlay()">名前を表示中</button>
    <button class="tb-btn" onclick="downloadResult()">保存 ↓</button>
  </div>
  <div class="canvas-wrap">
    <canvas id="pdf-canvas"></canvas>
    <canvas id="overlay-canvas"></canvas>
    <div id="img-wrap">
      <img id="source-img" alt="変換対象">
      <canvas id="img-overlay"></canvas>
    </div>
  </div>
  <div class="stats-row" id="stats-row"></div>
  <div id="result-list"></div>
</div>

<!-- 外部ライブラリ読み込み　-->
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"
  integrity="sha256-D5pcrQeUHwgmWGyU4InYm5GMRuXBfPLVo8b2ZuO8aU8="
  crossorigin="anonymous">
</script>

<script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"
  integrity="sha256-2N9WG5+6mOJPLlEw5AlIgJKBu7xVogxBI1nxoKXrNaY="
  crossorigin="anonymous">
</script>

<script type="module">
  import * as pdfjsLib from './vendor/pdfjs/pdf.5.4.149.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc =
  './vendor/pdfjs/pdf.worker.5.4.149.min.mjs';

let mapping = {};
let fileDataURL = null;
let fileMediaType = null;
let isPDF = false;
let pdfDoc = null;
let currentPage = 1;
let totalPages = 1;
let overlayVisible = true;
let pageAnnotations = {};
let uploadedFileName = '';
let idDigits = 5;  // 学籍番号の数字桁数（デフォルト5桁）

function changeDigits(delta) {
  idDigits = Math.max(3, Math.min(10, idDigits + delta));
  document.getElementById('digits-display').textContent = idDigits;
  document.getElementById('digits-badge').textContent = idDigits + '桁モード（例: ' + '1'.repeat(idDigits) + '）';
  document.getElementById('digits-summary').textContent = idDigits + '桁';
  document.getElementById('digits-minus').disabled = idDigits <= 3;
  document.getElementById('digits-plus').disabled = idDigits >= 10;
  const csvInput = document.getElementById('csv-input');
  if (csvInput.files[0]) loadCSV(csvInput);
}
window.changeDigits = changeDigits;

function toggleDigitsSetting() {
  const body = document.getElementById('digits-body');
  const chevron = document.getElementById('digits-chevron');
  const isOpen = body.style.display !== 'none';
  body.style.display = isOpen ? 'none' : 'block';
  chevron.style.transform = isOpen ? '' : 'rotate(180deg)';
}
window.toggleDigitsSetting = toggleDigitsSetting;

// 内部レンダリング解像度（表示サイズはCSSで制御）
const RENDER_QUALITY = 1.5;
function getRenderScale() {
  return RENDER_QUALITY;
}

// ---- CSV ----
function loadCSV(input) {
  const file = input.files[0];
  if (!file) return;
  const readerAB = new FileReader();
  readerAB.onload = e => {
    const buf = e.target.result;
    let text;
    try {
      text = new TextDecoder('utf-8', { fatal: true }).decode(buf);
    } catch(_) {
      text = new TextDecoder('shift-jis').decode(buf);
    }
    mapping = {};
    text.split(/\r?\n/).forEach(line => {
      const parts = line.split(',');
      if (parts.length < 2) return;
      const id = parts[0].trim().replace(/^"|"$/g, '');
      const name = parts.slice(1).join(',').trim().replace(/^"|"$/g, '');
      const normId = id.replace(/\s/g,'').toUpperCase();
      const csvRegex = new RegExp('^[A-Za-z]{0,2}\\d{' + idDigits + '}$');
      if (csvRegex.test(normId) && name) {
        const numKey = normId.replace(/^[A-Za-z]{0,2}/, '');
        mapping[numKey] = name;
      }
    });
    document.getElementById('csv-chip').style.display = 'flex';
    document.getElementById('csv-name').textContent = file.name;
    document.getElementById('csv-count').textContent = Object.keys(mapping).length + ' 件';
    checkReady();
  };
  readerAB.readAsArrayBuffer(file);
}
window.loadCSV = loadCSV;

function onFileSelect(input) {
  const file = input.files[0];
  if (!file) return;
  uploadedFileName = file.name;
  isPDF = true;
  fileMediaType = 'application/pdf';
  document.getElementById('file-chip').style.display = 'flex';
  document.getElementById('file-name').textContent = file.name;
  document.getElementById('file-type-badge').textContent = 'PDF';
  const reader = new FileReader();
  reader.onload = e => { fileDataURL = e.target.result; checkReady(); };
  reader.readAsDataURL(file);
}
window.onFileSelect = onFileSelect;

function checkReady() {
  document.getElementById('run-btn').disabled = !(Object.keys(mapping).length > 0 && fileDataURL);
}

function setProgress(pct, label, stage) {
  document.getElementById('progress-bar').style.width = Math.round(pct) + '%';
  if (label) document.getElementById('progress-label').textContent = label;
  if (stage !== undefined) document.getElementById('progress-stage').textContent = stage;
}

// ---- メイン処理 ----
async function runConversion() {
  const btn = document.getElementById('run-btn');
  btn.disabled = true;
  btn.textContent = '処理中...';
  if (fileDataURL) {
    const base64Len = (fileDataURL.split(',')[1] || '').length;
    const approxMB = (base64Len * 0.75) / (1024 * 1024);
    if (approxMB > 20) {
      const ok = confirm('ファイルサイズが大きいです（約' + approxMB.toFixed(1) + 'MB）。\n処理に時間がかかる場合があります。続行しますか？');
      if (!ok) { btn.disabled = false; btn.textContent = '変換してオーバーレイ表示'; return; }
    }
  }
  document.getElementById('progress-section').style.display = 'block';
  document.getElementById('viewer-section').style.display = 'none';
  pageAnnotations = {};

  try {
    await processPDF();
    await renderViewer();
    showStats();
    showResultList();
    document.getElementById('viewer-section').style.display = 'block';
  } catch(err) {
    alert('エラーが発生しました:\n' + err.message);
    console.error(err);
  }

  document.getElementById('progress-section').style.display = 'none';
  btn.disabled = false;
  btn.textContent = '変換してオーバーレイ表示';
}
window.runConversion = runConversion;

// ---- テキストレイヤーが実質的にあるか判定 ----
async function hasTextLayer(page) {
  const tc = await page.getTextContent();
  const totalChars = tc.items.reduce((s, it) => s + (it.str || '').length, 0);
  return totalChars > 20;
}

// ---- テキストレイヤーから学籍番号を抽出 ----
async function extractIDsFromTextLayer(page, renderScale) {
  const textContent = await page.getTextContent();
  const viewport = page.getViewport({ scale: renderScale });
  const results = [];
  const items = textContent.items;

  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    if (!item.str) continue;
    const str = item.str.trim();
    if (!str) continue;

    // \b を使わず、アルファベット0〜2文字 + 5桁数字のパターンを検索
    const extractRegex = new RegExp('([A-Za-z]{0,2}\\d{' + idDigits + '})', 'g');
    const matches = [...str.matchAll(extractRegex)];
    for (const m of matches) {
      const id = m[1].toUpperCase();
      const numKey = id.replace(/^[A-Za-z]{0,2}/, ''); // 数字部分のみで照合（idDigits桁）
      const matched = !!mapping[numKey];
      const name = mapping[numKey] || '（対応なし）';

      const tx = item.transform; // [scaleX, 0, 0, scaleY, originX, originY]
      const itemH = Math.abs(tx[3]) || item.height || 12;
      const totalWidth = item.width || 0;
      const charW = str.length > 0 && totalWidth > 0
        ? totalWidth / str.length
        : Math.abs(tx[0]) || 7;

      const matchStart = m.index;
      const pdfX0 = tx[4] + matchStart * charW;
      const pdfX1 = pdfX0 + id.length * charW;
      const pdfY  = tx[5];

      const pt0 = viewport.convertToViewportPoint(pdfX0, pdfY);
      const pt1 = viewport.convertToViewportPoint(pdfX1, pdfY - itemH); // pdfY+itemHとすれば学籍番号の真上に名前が挿入される

      results.push({
        original: id,
        name,
        matched,
        bbox: {
          x0: Math.min(pt0[0], pt1[0]),
          y0: Math.min(pt0[1], pt1[1]),
          x1: Math.max(pt0[0], pt1[0]),
          y1: Math.max(pt0[1], pt1[1])
        }
      });
    }
  }
  return results;
}

async function processPDF() {
  setProgress(5, 'PDFを読み込み中...', '');
  const base64 = fileDataURL.split(',')[1];
  const binary = atob(base64);
  const arr = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) arr[i] = binary.charCodeAt(i);
  pdfDoc = await pdfjsLib.getDocument({ data: arr }).promise;
  totalPages = pdfDoc.numPages;

  // 最初のページでテキストレイヤー有無を判定
  const firstPage = await pdfDoc.getPage(1);
  const useTextLayer = await hasTextLayer(firstPage);

  if (!useTextLayer) {
    throw new Error('このPDFにはテキストレイヤーがありません。\nテキスト付きPDF（デジタル生成PDF）を使用してください。');
  }
  for (let p = 1; p <= totalPages; p++) {
    setProgress(((p - 1) / totalPages) * 95 + 5,
      `テキスト抽出中 (${p}/${totalPages}ページ)`, '');
    const page = await pdfDoc.getPage(p);
    const renderScale = getRenderScale();
    pageAnnotations[p] = await extractIDsFromTextLayer(page, renderScale);
  }
    setProgress(100, '完了', '');
}

// ---- 描画 ----
async function renderViewer() {
  currentPage = 1;
  document.getElementById('img-wrap').style.display = 'none';
  document.getElementById('pdf-canvas').style.display = 'block';
  document.getElementById('overlay-canvas').style.display = 'block';
  await renderPDFPage(currentPage);
  updatePageButtons();
}

async function renderPDFPage(pageNum) {
  const page = await pdfDoc.getPage(pageNum);
  const scale = getRenderScale();
  const viewport = page.getViewport({ scale });
  const canvas = document.getElementById('pdf-canvas');
  const overlay = document.getElementById('overlay-canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  // 内部サイズと表示サイズを1:1に揃える（ズレ防止）
  canvas.style.width = canvas.width + 'px';
  canvas.style.height = canvas.height + 'px';
  overlay.width = viewport.width;
  overlay.height = viewport.height;
  // オーバーレイは内部サイズと1:1（CSSスケールなし）
  overlay.style.width = overlay.width + 'px';
  overlay.style.height = overlay.height + 'px';
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  const oSx = 1.0;
  const oSy = 1.0;
  drawOverlay(overlay, pageNum, oSx, oSy);
}


function drawOverlay(canvas, pageNum, sx, sy) {
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!overlayVisible) return;
  (pageAnnotations[pageNum] || []).forEach(ann => {
    if (!ann.bbox) return;
    const { x0, y0, x1, y1 } = ann.bbox;
    const bx = x0 * sx, by = y0 * sy;
    const bw = (x1 - x0) * sx, bh = (y1 - y0) * sy;
    const fontSize = Math.max(11, Math.min(bh * 0.82, 20));
    ctx.font = `500 ${fontSize}px 'Hiragino Sans', sans-serif`;
    const textW = ctx.measureText(ann.name).width;
    const rectW = Math.max(bw, textW) + 4;
    // 学籍番号を白矩形で隠す（名前が長い場合は右にはみ出す）
    ctx.fillStyle = 'rgba(255,255,255,0.94)';
    ctx.fillRect(bx - 2, by - 1, rectW, bh + 2);
    // 名前を上書き
    ctx.fillStyle = ann.matched ? '#185FA5' : '#A32D2D';
    ctx.fillText(ann.name, bx, by + bh * 0.82);
    // 薄い枠線
    ctx.strokeStyle = ann.matched ? 'rgba(37,99,168,0.2)' : 'rgba(153,31,31,0.2)';
    ctx.lineWidth = 0.8;
    ctx.strokeRect(bx - 2, by - 1, rectW, bh + 2);
  });
}

function showStats() {
  const all = Object.values(pageAnnotations).flat();
  const matched = all.filter(a => a.matched).length;
  const unmatched = all.length - matched;
  document.getElementById('stats-row').innerHTML = `
    <span class="badge badge-blue">検出: ${all.length} 件</span>
    <span class="badge badge-green">変換済み: ${matched} 件</span>
    ${unmatched > 0 ? `<span class="badge badge-red">対応なし: ${unmatched} 件</span>` : ''}
  `;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showResultList() {
  const all = Object.values(pageAnnotations).flat();
  document.getElementById('result-list').innerHTML = all.length === 0 ? '' :
    `<p class="section-divider" style="margin-top:16px;">検出された学籍番号</p>` +
    all.map(a => `
      <div class="result-item">
        <span class="result-id">${esc(a.original)}</span>
        <span class="result-arrow">→</span>
        <span class="result-name ${a.matched ? '' : 'unmatched'}">${esc(a.name)}</span>
      </div>
    `).join('');
}

function updatePageButtons() {
  document.getElementById('page-info').textContent = `${currentPage} / ${totalPages} ページ`;
  document.getElementById('prev-btn').disabled = currentPage <= 1;
  document.getElementById('next-btn').disabled = currentPage >= totalPages;
}

async function prevPage() {
  if (currentPage > 1) { currentPage--; await renderPDFPage(currentPage); updatePageButtons(); showResultList(); }
}
window.prevPage = prevPage;

async function nextPage() {
  if (currentPage < totalPages) { currentPage++; await renderPDFPage(currentPage); updatePageButtons(); showResultList(); }
}
window.nextPage = nextPage;

function toggleOverlay() {
  overlayVisible = !overlayVisible;
  const btn = document.getElementById('toggle-btn');
  btn.textContent = overlayVisible ? '名前を表示中' : '元の番号を表示中';
  btn.classList.toggle('active', overlayVisible);
  renderPDFPage(currentPage);
}
window.toggleOverlay = toggleOverlay;

// フォントバイト列をページライフタイムでキャッシュ
let __cachedNotoFontBytes = null;

async function downloadResult() {
  try {
    const { PDFDocument, rgb, StandardFonts } = PDFLib;

    // 1. 元PDFをpdf-libでロード
    const base64 = fileDataURL.split(',')[1];
    const srcBytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
    const srcDoc = await PDFDocument.load(srcBytes, { ignoreEncryption: true });
    const pdfLibDoc = await PDFDocument.create();

    // fontkitを登録
    pdfLibDoc.registerFontkit(fontkit);

    // 2. 全ページをコピー
    const pageIndices = Array.from({ length: totalPages }, (_, i) => i);
    const copiedPages = await pdfLibDoc.copyPages(srcDoc, pageIndices);
    copiedPages.forEach(p => pdfLibDoc.addPage(p));

    // 3. フルセット日本語フォント（約16MB）を取得して埋め込む
    let docFont;
    try {
      if (!__cachedNotoFontBytes) {
        __cachedNotoFontBytes = await fetch(
          'https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf'
        ).then(r => r.arrayBuffer());
      }
      docFont = await pdfLibDoc.embedFont(new Uint8Array(__cachedNotoFontBytes));
    } catch (e) {
      console.error('フォント取得失敗:', e);
      docFont = await pdfLibDoc.embedFont(StandardFonts.Helvetica);
    }

    const renderScale = getRenderScale();

    for (let p = 1; p <= totalPages; p++) {
      const libPage = pdfLibDoc.getPage(p - 1);
      const pageH = libPage.getHeight();
      const anns = pageAnnotations[p] || [];
      if (anns.length === 0) continue;

      for (const ann of anns) {
        const { x0, y0, x1, y1 } = ann.bbox;

        const pdfX = x0 / renderScale - 2;
        const pdfW = (x1 - x0) / renderScale + 4;
        const pdfH = (y1 - y0) / renderScale + 2;
        const pdfY = pageH - (y1 / renderScale) - 1;

        // 白矩形で学籍番号を隠す
        libPage.drawRectangle({
          x: pdfX, y: pdfY, width: pdfW, height: pdfH,
          color: rgb(1, 1, 1),
          opacity: 0.95,
        });

        // テキストとして名前を書き込む
        const fontSize = Math.max(6, Math.min(pdfH * 0.78, 14));
        libPage.drawText(ann.name, {
          x: pdfX + 1,
          y: pdfY + pdfH * 0.18,
          size: fontSize,
          font: docFont,
          color: ann.matched ? rgb(0.094, 0.373, 0.647) : rgb(0.639, 0.176, 0.176),
        });
      }
    }

    const pdfBytes = await pdfLibDoc.save();
    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = uploadedFileName.replace(/\.[^.]+$/, '') + '_変換済み.pdf';
    a.click();
    URL.revokeObjectURL(a.href);

  } catch (err) {
    console.error('変換エラー:', err);
  }
}
window.downloadResult = downloadResult;

</script>
